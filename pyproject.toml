[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dvdcc"
version = "0.1.0"
description = "Line-21 (CEA-608) closed captions for DVD-Video: Scenarist SCC or subtitles into MPEG-2 GOP user data"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "kajisho5" }]
keywords = ["closed captions", "cea-608", "line 21", "dvd", "scc", "mpeg-2"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/kajisho5/dvdcc"

[project.scripts]
dvdcc = "dvdcc.__main__:main"

[tool.setuptools]
packages = ["dvdcc"]
